<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sword Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-container"></div>
  
  <div id="status">Initializing...</div>
  
  <div id="controls">
    <button id="generate-sword">Generate New Sword</button>
  </div>
  
  <div id="loading">
    <p>Loading Sword Simulator...</p>
  </div>
  
  <div id="mobile-instructions">
    <h2>Sword Controller Mode</h2>
    <p>Move your phone to control the sword on the desktop screen.</p>
    <p>Swing quickly or raise it up for special effects!</p>
  </div>

  <div id="mobile-controls" style="display: none;">
    <button id="thrust-button">Thrust</button>
    <button id="special-attack">Special Attack</button>
    <button id="calibrate-button">Calibrate Sword Position</button>
  </div>
  
  <div class="calibration-overlay" id="calibration-overlay"></div>
  <div id="touch-area" style="display: none;"></div>
  <div class="sword-feedback" id="sword-feedback" style="display: none;"></div>
  <div class="debug-data" id="debug-data" style="display: none;"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"
      }
    }
  </script>
  
  <!-- Application scripts -->
  <script type="module" src="js/main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
