<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sword Simulator</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
    }
    
    #scene-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    
    #loading p {
      margin-top: 20px;
      font-size: 18px;
    }
    
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 5px;
      z-index: 5;
    }

    #controls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 5px;
      z-index: 5;
    }

    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 15px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 5px;
    }

    #mobile-instructions {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      z-index: 5;
    }
    
    #mobile-controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 5;
    }
    
    #mobile-controls button {
      margin: 5px;
      padding: 15px 25px;
      font-size: 18px;
    }
    
    .debug-data {
      position: fixed;
      bottom: 10px;
      right: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 5px;
      font-size: 12px;
      max-width: 200px;
      max-height: 150px;
      overflow: auto;
      z-index: 5;
    }
    
    #touch-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%;
      z-index: 4;
    }
    
    .sword-feedback {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      width: 120px;
      height: 240px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      z-index: 3;
      transition: transform 0.1s ease;
    }
  </style>
</head>
<body>
  <div id="scene-container"></div>
  
  <div id="status">Initializing...</div>
  
  <div id="controls">
    <button id="generate-sword">Generate New Sword</button>
  </div>
  
  <div id="loading">
    <p>Loading Sword Simulator...</p>
  </div>
  
  <div id="mobile-instructions">
    <h2>Sword Controller Mode</h2>
    <p>Move your phone to control the sword on the desktop screen.</p>
    <p>Swing quickly or raise it up for special effects!</p>
  </div>

  <div id="mobile-controls" style="display: none;">
    <button id="thrust-button">Thrust</button>
    <button id="special-attack">Special Attack</button>
  </div>
  
  <div id="touch-area" style="display: none;"></div>
  <div class="sword-feedback" id="sword-feedback" style="display: none;"></div>
  <div class="debug-data" id="debug-data" style="display: none;"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Global variables
    let camera, scene, renderer;
    let sword, swordGroup;
    let isMobile = false;
    let isDesktop = false;
    let room;
    let currentUser;
    let sameUserConnected = false;
    let isGeneratingSword = false;
    let lastAcceleration = { x: 0, y: 0, z: 0 };
    let accelerationThreshold = 15; // Threshold for vibration
    let lastVibrationTime = 0;
    let vibrationCooldown = 500; // ms
    let motionPermissionGranted = false;
    let orientationPermissionGranted = false;
    let touchStartTime = 0;
    let touchStartPos = { x: 0, y: 0 };
    let lastSwingTime = 0;
    let swingCooldown = 300; // ms
    let lastTouch = null;
    let debugMode = true; // Set to false in production
    
    // Check if device is mobile
    function detectDevice() {
      isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      isDesktop = !isMobile;
      return isMobile ? 'mobile' : 'desktop';
    }
    
    // Initialize the application
    async function init() {
      const deviceType = detectDevice();
      
      // Initialize the realtime room
      room = new WebsimSocket();
      await room.initialize();
      
      currentUser = {
        id: room.clientId,
        username: room.peers[room.clientId].username,
        avatarUrl: room.peers[room.clientId].avatarUrl,
        deviceType: deviceType
      };
      
      // Setup presence data
      room.updatePresence({
        deviceType: deviceType,
        username: currentUser.username,
        orientation: { alpha: 0, beta: 0, gamma: 0 },
        acceleration: { x: 0, y: 0, z: 0 },
        gestures: { tap: false, swipe: false, direction: null },
        lastSwing: 0,
        connected: true
      });
      
      // Subscribe to presence updates
      room.subscribePresence((presence) => {
        checkForSameUser(presence);
        
        // Sync sword position if we're the desktop
        if (isDesktop && sameUserConnected && sword) {
          for (const clientId in presence) {
            if (clientId !== room.clientId && presence[clientId].username === currentUser.username && presence[clientId].deviceType === 'mobile') {
              if (presence[clientId].orientation) {
                updateSwordOrientation(presence[clientId].orientation);
              }
              if (presence[clientId].acceleration) {
                checkForSwingMotion(presence[clientId].acceleration);
              }
              if (presence[clientId].gestures) {
                handleMobileGestures(presence[clientId].gestures);
              }
            }
          }
        }
      });
      
      // Setup message handling for realtime events
      room.onmessage = (event) => {
        const data = event.data;
        if (data.type === "sword_action" && isDesktop) {
          performSwordAction(data.action, data.params);
        }
      };
      
      // Set up 3D scene on desktop
      if (isDesktop) {
        setupDesktopScene();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Desktop)`;
        document.getElementById('generate-sword').addEventListener('click', generateSword);
      } 
      // Set up mobile controller
      else {
        setupMobileController();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('mobile-instructions').style.display = 'block';
        document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Mobile)`;
        document.getElementById('controls').style.display = 'none';
        document.getElementById('mobile-controls').style.display = 'block';
        document.getElementById('touch-area').style.display = 'block';
        document.getElementById('sword-feedback').style.display = 'block';
        
        if (debugMode) {
          document.getElementById('debug-data').style.display = 'block';
        }
      }
      
      // Stay alive - periodically send keepalive presence updates
      setInterval(() => {
        if (isMobile) {
          room.updatePresence({
            connected: true,
            timestamp: Date.now()
          });
        }
      }, 5000);
    }
    
    // Check if the same user is connected with multiple devices
    function checkForSameUser(presence) {
      sameUserConnected = false;
      for (const clientId in presence) {
        if (clientId !== room.clientId && presence[clientId].username === currentUser.username) {
          sameUserConnected = true;
          
          // If we're mobile and desktop is already connected
          if (isMobile && presence[clientId].deviceType === 'desktop') {
            document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Mobile - Controlling Desktop)`;
          }
          // If we're desktop and mobile is connected
          else if (isDesktop && presence[clientId].deviceType === 'mobile') {
            document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Desktop - Controlled by Mobile)`;
          }
        }
      }
      
      if (!sameUserConnected) {
        if (isDesktop) {
          document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Desktop - Waiting for mobile)`;
        } else {
          document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Mobile - Waiting for desktop)`;
        }
      }
    }
    
    // Set up the 3D scene for desktop
    function setupDesktopScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x333333);
      
      // Create camera
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;
      
      // Create renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.getElementById('scene-container').appendChild(renderer.domElement);
      
      // Add lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(1, 1, 1);
      scene.add(directionalLight);
      
      // Create a group for the sword for easier rotation
      swordGroup = new THREE.Group();
      scene.add(swordGroup);
      
      // Create camera controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      
      // Generate initial sword
      generateSword();
      
      // Resize handler
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      
      // Start animation loop
      animate();
    }
    
    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    
    // Generate a new sword using the LLM
    async function generateSword() {
      if (isGeneratingSword) return;
      isGeneratingSword = true;
      
      document.getElementById('status').textContent = 'Generating sword...';
      
      try {
        // Generate a sword image using the LLM
        const result = await websim.imageGen({
          prompt: "A detailed fantasy sword on a solid white background, high resolution, with an ornate handle and detailed blade, clear lighting, no shadows, centered composition, metallic texture of the blade, detailed handle with leather wrapping, fantasy style sword, sharp edge, isolated on pure white",
          aspect_ratio: "1:1",
        });
        
        // Get the image URL
        const imageUrl = result.url;
        
        // Load the image
        const image = new Image();
        image.crossOrigin = "Anonymous";
        image.src = imageUrl;
        
        image.onload = function() {
          // Process the image to remove the background
          const processedImage = removeBackground(image);
          
          // Create a texture from the processed image
          const texture = new THREE.Texture(processedImage);
          texture.needsUpdate = true;
          
          // Create material with transparency
          const material = new THREE.MeshBasicMaterial({ 
            map: texture, 
            transparent: true,
            side: THREE.DoubleSide
          });
          
          // Create a plane with the sword texture
          const geometry = new THREE.PlaneGeometry(3, 3);
          
          // Remove existing sword if present
          if (sword) {
            swordGroup.remove(sword);
          }
          
          // Create new sword
          sword = new THREE.Mesh(geometry, material);
          swordGroup.add(sword);
          
          // Position the sword on the right side of the screen
          sword.position.set(2, 0, 0);
          
          document.getElementById('status').textContent = `Connected as: ${currentUser.username} (Desktop${sameUserConnected ? ' - Controlled by Mobile' : ' - Waiting for mobile'})`;
          isGeneratingSword = false;
        };
        
        image.onerror = function() {
          document.getElementById('status').textContent = 'Error loading sword image!';
          isGeneratingSword = false;
        };
      } catch (error) {
        console.error('Error generating sword:', error);
        document.getElementById('status').textContent = 'Error generating sword!';
        isGeneratingSword = false;
      }
    }
    
    // Remove the white background from the image
    function removeBackground(image) {
      const canvas = document.createElement('canvas');
      canvas.width = image.width;
      canvas.height = image.height;
      const ctx = canvas.getContext('2d');
      
      // Draw the image to the canvas
      ctx.drawImage(image, 0, 0);
      
      // Get the image data
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      // Remove white background (with some tolerance)
      const threshold = 230; // RGB threshold for white
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        
        // If the pixel is close to white, make it transparent
        if (r > threshold && g > threshold && b > threshold) {
          data[i + 3] = 0; // Set alpha to 0
        }
      }
      
      // Put the modified image data back
      ctx.putImageData(imageData, 0, 0);
      
      return canvas;
    }
    
    // Setup mobile controller
    function setupMobileController() {
      // Add clear status message about permissions
      document.getElementById('status').textContent = 'Waiting for motion and orientation permissions...';
      
      // Request permissions for device motion and orientation
      if (typeof DeviceMotionEvent.requestPermission === 'function' || 
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ requires permission request
        document.getElementById('mobile-instructions').innerHTML += 
          '<p>Tap "Allow" when prompted for motion and orientation access.</p>' +
          '<button id="request-permissions" style="background-color: #ff5722; padding: 15px; margin-top: 10px;">Enable Motion Controls</button>';
        
        document.getElementById('request-permissions').addEventListener('click', requestMotionPermission);
      } else {
        // Non-iOS devices or older iOS versions
        enableMotionAndOrientation();
      }
      
      // Set up touch handlers
      const touchArea = document.getElementById('touch-area');
      touchArea.addEventListener('touchstart', handleTouchStart);
      touchArea.addEventListener('touchmove', handleTouchMove);
      touchArea.addEventListener('touchend', handleTouchEnd);
      
      // Set up mobile button handlers
      document.getElementById('thrust-button').addEventListener('click', () => {
        sendSwordAction('thrust');
        navigator.vibrate([100, 30, 100]); // Enhanced vibration pattern
      });
      
      document.getElementById('special-attack').addEventListener('click', () => {
        sendSwordAction('special');
        navigator.vibrate([50, 30, 50, 30, 50, 30, 150]); // Enhanced vibration pattern
      });
    }
    
    // Request motion and orientation permissions for iOS
    async function requestMotionPermission() {
      try {
        document.getElementById('status').textContent = 'Requesting motion and orientation permissions...';
        
        // Request device motion permission (iOS 13+)
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          const motionPermission = await DeviceMotionEvent.requestPermission();
          if (motionPermission === 'granted') {
            motionPermissionGranted = true;
            document.getElementById('status').textContent = 'Motion permission granted!';
          } else {
            document.getElementById('status').textContent = 'Motion permission denied!';
            return;
          }
        } else {
          motionPermissionGranted = true;
        }
        
        // Request device orientation permission (iOS 13+)
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const orientationPermission = await DeviceOrientationEvent.requestPermission();
          if (orientationPermission === 'granted') {
            orientationPermissionGranted = true;
            document.getElementById('status').textContent = 'Orientation permission granted!';
          } else {
            document.getElementById('status').textContent = 'Orientation permission denied!';
            return;
          }
        } else {
          orientationPermissionGranted = true;
        }
        
        // Hide the permission button if it exists
        const permButton = document.getElementById('request-permissions');
        if (permButton) permButton.style.display = 'none';
        
        enableMotionAndOrientation();
      } catch (error) {
        console.error('Error requesting motion/orientation permission:', error);
        document.getElementById('status').textContent = 'Error requesting permissions: ' + error.message;
      }
    }
    
    // Enable motion and orientation events after permissions
    function enableMotionAndOrientation() {
      document.getElementById('status').textContent = 'Setting up motion and orientation...';
      
      // Check if device orientation API is available
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation, true);
        document.getElementById('status').textContent = 'Orientation tracking enabled!';
      } else {
        document.getElementById('status').textContent = 'Device orientation not supported!';
      }
      
      // Check if device motion API is available
      if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', handleMotion, true);
        document.getElementById('status').textContent = 'Motion tracking enabled!';
      } else {
        document.getElementById('status').textContent = 'Device motion not supported!';
      }
      
      // Send immediate test data to confirm connection
      sendTestOrientation();
    }
    
    // Send test orientation data to verify the connection is working
    function sendTestOrientation() {
      room.updatePresence({
        orientation: {
          alpha: 0,
          beta: 0,
          gamma: 0
        },
        testMessage: "Orientation data initialized"
      });
      
      // Log to console for debugging
      console.log("Test orientation data sent");
      
      // Update debug display
      if (debugMode) {
        updateDebugInfo('status', {message: 'Test orientation data sent'});
      }
    }
    
    // Handle device orientation data
    function handleOrientation(event) {
      if (!isMobile) return;
      
      // Get orientation data with fallbacks
      const orientation = {
        alpha: event.alpha || 0,      // Z-axis rotation [0-360)
        beta: event.beta || 0,        // X-axis rotation [-180, 180]
        gamma: event.gamma || 0,      // Y-axis rotation [-90, 90]
        absolute: event.absolute || false
      };
      
      // Update our presence with the new orientation
      room.updatePresence({
        orientation: orientation,
        timestamp: Date.now()
      });
      
      // Update visual feedback on mobile
      updateMobileSwordFeedback(orientation);
      
      // Update debug info
      if (debugMode) {
        updateDebugInfo('orientation', orientation);
        
        // Check if data is actually changing
        const lastData = JSON.stringify(orientation);
        const isChanging = lastData !== JSON.stringify(lastOrientation || {});
        updateDebugInfo('orientationStatus', {isChanging: isChanging});
        lastOrientation = JSON.parse(lastData);
      }
    }
    
    // Track last orientation for change detection
    let lastOrientation = null;
    
    // Handle device motion/acceleration data
    function handleMotion(event) {
      if (!isMobile) return;
      
      // Get acceleration data with fallbacks
      const rawAcceleration = event.acceleration || event.accelerationIncludingGravity || { x: 0, y: 0, z: 0 };
      const acceleration = {
        x: rawAcceleration.x || 0,
        y: rawAcceleration.y || 0,
        z: rawAcceleration.z || 0
      };
      
      // Get rotation rate with fallbacks
      const rotationRate = event.rotationRate || { alpha: 0, beta: 0, gamma: 0 };
      
      // Update our presence with the new data
      room.updatePresence({
        acceleration: acceleration,
        rotationRate: {
          alpha: rotationRate.alpha || 0,
          beta: rotationRate.beta || 0,
          gamma: rotationRate.gamma || 0
        },
        timestamp: Date.now()
      });
      
      // Update debug info
      if (debugMode) {
        updateDebugInfo('acceleration', acceleration);
        updateDebugInfo('rotationRate', rotationRate);
      }
      
      // Check if we need to vibrate and send events based on acceleration
      if (sameUserConnected) {
        detectSwing(acceleration);
      }
    }
    
    // Detect swing motion from acceleration data
    function detectSwing(acceleration) {
      // Calculate total acceleration magnitude
      const totalAcceleration = Math.sqrt(
        Math.pow(acceleration.x || 0, 2) + 
        Math.pow(acceleration.y || 0, 2) + 
        Math.pow(acceleration.z || 0, 2)
      );
      
      const now = Date.now();
      
      // Check if acceleration exceeds threshold and we're not in cooldown
      if (totalAcceleration > accelerationThreshold && now - lastSwingTime > swingCooldown) {
        lastSwingTime = now;
        
        // Determine swing direction based on acceleration vector
        let direction = 'horizontal';
        if (Math.abs(acceleration.y) > Math.abs(acceleration.x) && Math.abs(acceleration.y) > Math.abs(acceleration.z)) {
          direction = acceleration.y > 0 ? 'up' : 'down';
        } else if (Math.abs(acceleration.x) > Math.abs(acceleration.y) && Math.abs(acceleration.x) > Math.abs(acceleration.z)) {
          direction = acceleration.x > 0 ? 'right' : 'left';
        }
        
        // Send the swing event
        sendSwordAction('swing', { 
          force: totalAcceleration,
          direction: direction
        });
        
        // Update presence with swing info
        room.updatePresence({
          gestures: {
            swipe: true,
            direction: direction,
            force: totalAcceleration
          },
          lastSwing: now
        });
        
        // Vibrate based on the strength of the swing
        if (totalAcceleration > accelerationThreshold * 2) {
          navigator.vibrate([100, 50, 100, 50, 150]); // Strong swing
        } else {
          navigator.vibrate([80, 40, 80]); // Normal swing
        }
        lastVibrationTime = now;
        
        if (debugMode) {
          updateDebugInfo('swingEvent', {
            force: totalAcceleration,
            direction: direction,
            time: new Date(now).toLocaleTimeString()
          });
        }
      }
      
      // Reset the swipe gesture after a short delay
      setTimeout(() => {
        room.updatePresence({
          gestures: {
            swipe: false,
            direction: null
          }
        });
      }, 200);
      
      // Get orientation data from presence
      const orientation = room.presence[room.clientId]?.orientation;
      
      // Vibrate when sword is raised up (beta angle close to -90)
      if (orientation && orientation.beta < -70 && now - lastVibrationTime > vibrationCooldown) {
        sendSwordAction('raise');
        navigator.vibrate([50, 30, 50, 30, 100]);
        lastVibrationTime = now;
        
        if (debugMode) {
          updateDebugInfo('raiseEvent', {
            beta: orientation.beta,
            time: new Date(now).toLocaleTimeString()
          });
        }
      }
    }
    
    // Handle touch start event
    function handleTouchStart(event) {
      touchStartTime = Date.now();
      if (event.touches.length > 0) {
        const touch = event.touches[0];
        touchStartPos = { x: touch.clientX, y: touch.clientY };
        lastTouch = { x: touch.clientX, y: touch.clientY };
      }
    }
    
    // Handle touch move event
    function handleTouchMove(event) {
      event.preventDefault();
      if (event.touches.length > 0) {
        const touch = event.touches[0];
        const currentPos = { x: touch.clientX, y: touch.clientY };
        
        // Calculate swipe distance and direction
        const deltaX = currentPos.x - touchStartPos.x;
        const deltaY = currentPos.y - touchStartPos.y;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        
        // Update last touch position
        lastTouch = currentPos;
        
        // If significant movement, it's a swipe
        if (distance > 50) {
          const now = Date.now();
          if (now - lastSwingTime > swingCooldown) {
            lastSwingTime = now;
            
            // Calculate swipe direction
            let direction = 'horizontal';
            if (Math.abs(deltaY) > Math.abs(deltaX)) {
              direction = deltaY > 0 ? 'down' : 'up';
            } else {
              direction = deltaX > 0 ? 'right' : 'left';
            }
            
            // Calculate swipe speed
            const speed = distance / (now - touchStartTime);
            
            // Send the swipe event
            sendSwordAction('swipe', { 
              direction: direction, 
              speed: speed 
            });
            
            // Update presence with swipe info
            room.updatePresence({
              gestures: {
                swipe: true,
                direction: direction,
                speed: speed
              }
            });
            
            // Vibrate based on swipe speed
            if (speed > 1.5) {
              navigator.vibrate([100, 50, 100]);
            } else {
              navigator.vibrate([50, 20, 50]);
            }
            
            // Reset the start position for continuous swipes
            touchStartPos = currentPos;
            touchStartTime = now;
            
            if (debugMode) {
              updateDebugInfo('swipeEvent', {
                direction: direction,
                speed: speed,
                time: new Date(now).toLocaleTimeString()
              });
            }
          }
        }
      }
    }
    
    // Handle touch end event
    function handleTouchEnd(event) {
      const tapDuration = Date.now() - touchStartTime;
      
      // Reset swipe status
      room.updatePresence({
        gestures: {
          swipe: false,
          direction: null
        }
      });
      
      // If it was a quick tap (not a swipe)
      if (tapDuration < 200 && lastTouch) {
        const deltaX = lastTouch.x - touchStartPos.x;
        const deltaY = lastTouch.y - touchStartPos.y;
        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        
        if (distance < 10) {
          // Send tap event
          sendSwordAction('tap', { 
            x: touchStartPos.x, 
            y: touchStartPos.y 
          });
          
          // Update presence with tap info
          room.updatePresence({
            gestures: {
              tap: true,
              x: touchStartPos.x,
              y: touchStartPos.y
            }

          // Vibrate for tap
          navigator.vibrate(50);

          setTimeout(() => {

    // Update sword orientation based on mobile device orientation
    function updateSwordOrientation(orientation) {
      if (!swordGroup || !orientation) return;
      
      // Reset the rotation to avoid accumulation
      swordGroup.rotation.set(0, 0, 0);
      
      // Convert degrees to radians
      const alphaRad = THREE.MathUtils.degToRad(orientation.alpha || 0);
      const betaRad = THREE.MathUtils.degToRad(orientation.beta || 0);
      const gammaRad = THREE.MathUtils.degToRad(orientation.gamma || 0);
      
      // Apply the rotation - improved mapping for more intuitive control
      swordGroup.rotation.z = gammaRad; // Tilt left/right (roll)
      swordGroup.rotation.x = betaRad * 0.6; // Tilt forward/backward (pitch)
      swordGroup.rotation.y = -alphaRad * 0.4; // Rotation around vertical axis (yaw)
      
      // Log orientation updates if in debug mode
      if (debugMode && isDesktop) {
        console.log('Updating sword orientation:', orientation);
      }
    }
    
    // Update visual feedback on mobile device
    function updateMobileSwordFeedback(orientation) {
      const swordFeedback = document.getElementById('sword-feedback');
      if (swordFeedback && orientation) {
        // Apply rotation based on orientation with better visual feedback
        const tiltX = orientation.beta * 0.6; // Pitch
        const tiltY = orientation.gamma; // Roll
        
        swordFeedback.style.transform = `translate(-50%, -50%) 
          rotate(${tiltY}deg) 
          perspective(500px) 
          rotateX(${-tiltX}deg)`;
          
        // Add color indication based on orientation intensity
        const intensity = Math.min(100, Math.abs(tiltX) + Math.abs(tiltY));
        swordFeedback.style.backgroundColor = `rgba(255, ${255 - intensity * 2}, ${255 - intensity * 2}, 0.3)`;
      }

    // Handle mobile gestures on the desktop
    function handleMobileGestures(gestures) {
      if (!gestures) return;
      
      if (gestures.tap) {
        // Handle tap gesture
        performSwordAction('tap', { x: gestures.x, y: gestures.y });
      }
      
      if (gestures.swipe) {
        // Handle swipe gesture
        performSwordAction('swipe', { 
          direction: gestures.direction,
          speed: gestures.speed || 1
        });
      }
    }
    
    // Check for swing motion and animate sword
    function checkForSwingMotion(acceleration) {
      if (!acceleration) return;
      
      const totalAcceleration = Math.sqrt(
        Math.pow(acceleration.x || 0, 2) + 
        Math.pow(acceleration.y || 0, 2) + 
        Math.pow(acceleration.z || 0, 2)
      );
      
      if (totalAcceleration > accelerationThreshold) {
        // Apply a "swinging" animation to the sword
        if (swordGroup) {
          // Add a slight rotation or movement to simulate swinging
          const swingDirection = Math.sign(acceleration.x) || 1;
          
          // Get the current rotation as a starting point
          const startRotation = { 
            x: swordGroup.rotation.x, 
            y: swordGroup.rotation.y, 
            z: swordGroup.rotation.z 
          };
          
          // Calculate swing amount based on acceleration
          const swingAmount = totalAcceleration / 25; // Adjusted for more responsive movement
          
          // Animation timing
          let startTime = null;
          const duration = 300; // ms
          
          function animateSwing(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            if (progress < 1) {
              // Apply a sine wave motion for the swing with improved dynamics
              const swingProgress = Math.sin(progress * Math.PI);
              
              // Apply rotation based on acceleration direction
              if (Math.abs(acceleration.x) > Math.abs(acceleration.y)) {
                // Horizontal swing (z-axis rotation)
                swordGroup.rotation.z = startRotation.z + swingDirection * swingAmount * swingProgress;
              } else {
                // Vertical swing (x-axis rotation)
                const verticalDirection = Math.sign(acceleration.y) || 1;
                swordGroup.rotation.x = startRotation.x + verticalDirection * swingAmount * swingProgress;
              }
              
              requestAnimationFrame(animateSwing);
            } else {
              // Reset to original rotation
              swordGroup.rotation.x = startRotation.x;
              swordGroup.rotation.y = startRotation.y;
              swordGroup.rotation.z = startRotation.z;
            }
          }
          
          requestAnimationFrame(animateSwing);
        }
      }
      
      lastAcceleration = acceleration;
    }
    
    // Send a sword action from mobile to desktop
    function sendSwordAction(action, params = {}) {
      room.send({
        type: "sword_action",
        action: action,
        params: params,
        echo: false,
        timestamp: Date.now()
      });
      
      if (debugMode) {
        updateDebugInfo('sentAction', {
          action: action,
          params: JSON.stringify(params).substring(0, 30),
          time: new Date().toLocaleTimeString()
        });
      }
    }
    
    // Perform a sword action on the desktop
    function performSwordAction(action, params = {}) {
      if (!swordGroup) return;
      
      switch (action) {
        case 'swing':
          animateSwingAction(params.direction, params.force || 1);
          break;
        case 'swipe':
          animateSwipeAction(params.direction, params.speed || 1);
          break;
        case 'tap':
          animateTapAction();
          break;
        case 'thrust':
          animateThrustAction();
          break;
        case 'special':
          animateSpecialAttack();
          break;
        case 'raise':
          animateRaiseAction();
          break;
      }
    }
    
    // Animation for sword swing action
    function animateSwingAction(direction, force) {
      if (!swordGroup) return;
      
      const startPosition = swordGroup.position.clone();
      const startRotation = new THREE.Euler().copy(swordGroup.rotation);
      
      let animateX = 0;
      let animateY = 0;
      let animateZ = 0;
      
      // Set animation based on direction
      if (direction === 'left' || direction === 'right') {
        animateZ = direction === 'right' ? -0.8 * force : 0.8 * force;
      } else if (direction === 'up' || direction === 'down') {
        animateX = direction === 'down' ? -0.8 * force : 0.8 * force;
      } else {
        animateZ = 0.8 * force;
      }
      
      // Animation timeline
      let startTime = null;
      const duration = 300; // ms
      
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        if (progress < 1) {
          // Using sine wave for smooth swing effect
          const swingProgress = Math.sin(progress * Math.PI);
          
          // Apply rotation
          swordGroup.rotation.x = startRotation.x + animateX * swingProgress;
          swordGroup.rotation.y = startRotation.y + animateY * swingProgress;
          swordGroup.rotation.z = startRotation.z + animateZ * swingProgress;
          
          requestAnimationFrame(animate);
        } else {
          // Reset position and rotation
          swordGroup.position.copy(startPosition);
          swordGroup.rotation.copy(startRotation);
        }
      }
      
      requestAnimationFrame(animate);
    }
    
    // Animation for sword swipe action
    function animateSwipeAction(direction, speed) {
      animateSwingAction(direction, speed);
    }
    
    // Animation for tap action (quick jab)
    function animateTapAction() {
      if (!swordGroup) return;
      
      const startPosition = swordGroup.position.clone();
      
      // Animation timeline
      let startTime = null;
      const duration = 200; // ms
      
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        if (progress < 1) {
          // Forward and back motion
          if (progress < 0.5) {
            // Forward motion
            swordGroup.position.z = startPosition.z - 0.5 * (progress * 2);
          } else {
            // Return motion
            swordGroup.position.z = startPosition.z - 0.5 * (1 - (progress - 0.5) * 2);
          }
          
          requestAnimationFrame(animate);
        } else {
          // Reset position
          swordGroup.position.copy(startPosition);
        }
      }
      
      requestAnimationFrame(animate);
    }
    
    // Animation for thrust action
    function animateThrustAction() {
      if (!swordGroup) return;
      
      const startPosition = swordGroup.position.clone();
      
      // Animation timeline
      let startTime = null;
      const duration = 400; // ms
      
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        if (progress < 1) {
          // Forward and back motion with easing
          if (progress < 0.4) {
            // Forward motion
            swordGroup.position.z = startPosition.z - 1.5 * (progress / 0.4);
          } else if (progress < 0.6) {
            // Hold at forward position
            swordGroup.position.z = startPosition.z - 1.5;
          } else {
            // Return motion
            swordGroup.position.z = startPosition.z - 1.5 * (1 - (progress - 0.6) / 0.4);
          }
          
          requestAnimationFrame(animate);
        } else {
          // Reset position
          swordGroup.position.copy(startPosition);
        }
      }
      
      requestAnimationFrame(animate);
    }
    
    // Animation for special attack
    function animateSpecialAttack() {
      if (!swordGroup) return;
      
      const startPosition = swordGroup.position.clone();
      const startRotation = new THREE.Euler().copy(swordGroup.rotation);
      
      // Animation timeline
      let startTime = null;
      const duration = 1000; // ms
      
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        if (progress < 1) {
          // Full 360-degree spin
          swordGroup.rotation.y = startRotation.y + Math.PI * 2 * progress;
          
          // Move forward during the middle of the animation
          if (progress > 0.25 && progress < 0.75) {
            const moveProgress = (progress - 0.25) / 0.5;
            if (moveProgress < 0.5) {
              // Move forward
              swordGroup.position.z = startPosition.z - moveProgress * 2;
            } else {
              // Move back
              swordGroup.position.z = startPosition.z - (1 - (moveProgress - 0.5) * 2);
            }
          }
          
          requestAnimationFrame(animate);
        } else {
          // Reset position and rotation
          swordGroup.position.copy(startPosition);
          swordGroup.rotation.copy(startRotation);
        }
      }
      
      requestAnimationFrame(animate);
    }
    
    // Animation for raising the sword
    function animateRaiseAction() {
      if (!swordGroup) return;
      
      const startRotation = new THREE.Euler().copy(swordGroup.rotation);
      
      // Animation timeline
      let startTime = null;
      const duration = 800; // ms
      
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        if (progress < 1) {
          // Raise the sword up
          if (progress < 0.4) {
            // Raise up
            swordGroup.rotation.x = startRotation.x - Math.PI * 0.5 * (progress / 0.4);
          } else if (progress < 0.7) {
            // Hold up
            swordGroup.rotation.x = startRotation.x - Math.PI * 0.5;
          } else {
            // Lower down
            swordGroup.rotation.x = startRotation.x - Math.PI * 0.5 * (1 - (progress - 0.7) / 0.3);
          }
          
          requestAnimationFrame(animate);
        } else {
          // Reset rotation
          swordGroup.rotation.copy(startRotation);
        }
      }
      
      requestAnimationFrame(animate);

    // Update debug information display
    function updateDebugInfo(type, data) {

      if (!debugElement.querySelector(`.${type}-debug`)) {
        const section = document.createElement('div');
        section.className = `${type}-debug`;
        section.innerHTML = `<strong>${type}:</strong> <span></span>`;
        debugElement.appendChild(section);
        
        // Keep only the most recent debug sections
        if (debugElement.children.length > 8) {
          debugElement.removeChild(debugElement.children[0]);
        }
      }
      
      // Update the section content
      const section = debugElement.querySelector(`.${type}-debug span`);
      if (section) {
        if (typeof data === 'object') {
          section.textContent = JSON.stringify(data, null, 2)
            .replace(/[{}"]/g, '')
            .replace(/,/g, ', ')
            .substring(0, 100); // Truncate if too long
        } else {
          section.textContent = String(data);
        }

    window.addEventListener('load', init);
